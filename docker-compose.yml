version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: biointeraction-postgres
    environment:
      POSTGRES_DB: biointeraction_db
      POSTGRES_USER: bio_user
      POSTGRES_PASSWORD: bio_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: biointeraction-neo4j
    environment:
      NEO4J_AUTH: neo4j/testpassword
    ports:
      - "7474:7474"
      - "7687:7687"

volumes:
  postgres_data:
